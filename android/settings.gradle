pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }

    // Used only for standalone IDE imports; Flutter hosts supply their own versions.
    plugins {
        id 'com.android.library' version '9.0.1'
        id 'org.jetbrains.kotlin.android' version '2.3.20'
    }
}

dependencyResolutionManagement {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = 'usb_camera_sdk'
