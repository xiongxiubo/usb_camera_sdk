plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

group = 'com.flyphoto.usb_camera_sdk'
version = '1.0'

// Flutter injects this extension when the SDK is loaded by a host application.
// Standalone IDE imports use the defaults from the current Flutter toolchain.
def flutterConfig = project.extensions.findByName('flutter')

android {
    namespace 'com.flyphoto.usb_camera_sdk'
    compileSdk flutterConfig?.compileSdkVersion ?: 36
    ndkVersion flutterConfig?.ndkVersion ?: '28.2.13676358'

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    defaultConfig {
        minSdk flutterConfig?.minSdkVersion ?: 24
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86_64'
        }

        externalNativeBuild {
            cmake {
                cppFlags += ['-std=c++17', '-fexceptions']
            }
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
            assets.srcDirs = ['src/main/assets']
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
